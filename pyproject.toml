[project]
name = "mcp-sharepoint"
version = "0.2.0"
description = "MCP Server for SharePoint with HR Analytics and Interactive Visualizations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 # Core MCP and SharePoint integration
 "mcp>=1.2.1",
 "office365-rest-python-client>=2.6.1",
 "msal>=1.24.0",
 "requests>=2.31.0",
 "python-dotenv>=1.0.0",
 
 # Document processing and text extraction
 "pymupdf>=1.23.0",
 "python-docx>=1.1.0",
 "python-pptx>=0.6.21",
 "openpyxl>=3.1.0",
 
 # Data analysis and processing
 "pandas>=2.0.0",
 "numpy>=1.24.0",
 
 # Configuration and metadata parsing
 "PyYAML>=6.0.0",
]

[[project.authors]]
name = "sofias tech"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
mcp-sharepoint = "mcp_sharepoint:main"